# ssq_evo 引擎超参配置（外部化）
# 取代 run_cycle.py 内联 DEFAULT_CFG。改这里即可调参，无需动代码。
# 加载器: configs/loader.py (零依赖; 优先 pyyaml, 缺失回退手写解析)

engine:
  evolution:
    epochs: 7          # 演化代数 (对齐原 config.json 活跃值)
    pop: 32            # 种群规模
    seed: 20260813     # 随机种子
    oos_frac: 0.2      # 样本外验证占比

  surrogate:
    k_light: 100       # 轻量检验 surrogate 数 (对齐原 config.json 活跃值)
    k_heavy: 60        # 重型检验 surrogate 数
    k_causal: 50       # 因果扫描专用(8方向×检验下需更高分辨率保证检出功效)
    k_nonstat: 300     # 非平稳监控 surrogate 数 (49球×2检验; 动量 FDR 分辨率略不足, 真实数据本就 null)

  gates:
    fdr_q: 0.05        # 结构显著 FDR 门槛
    alert_q: 0.01      # ALERT 闸门 q 阈值
    alert_oos_p: 0.01  # ALERT 闸门 OOS p 阈值
    wf_n_folds: 3      # 发现/确认分离闸门(#41)：walk-forward 折数
    wf_disc_frac: 0.7  # 发现/确认分离闸门(#41)：发现段占比(余下为确认段)

  cache:
    enabled: true      # #40 增量评估缓存：同(基因组,数据集指纹)复用，严格等价不改统计
    path: eval_cache.json  # 缓存文件(容器 DATA_DIR 下)

  # #39 可微 Formula（实验性，当前已启用）：发现段数值优化连续超参生成候选，
  # 冻结后经统一诚信闸门(BH-FDR + OOT + 交叉零假设 + #41 发现/确认分离)重判，不绕过。
  # 仅当演化/谱扫描覆盖不足、且接受额外算力开销时启用。
  # 注：配置加载器把嵌套 dict 扁平化为「叶子键」（不保留父级名），故叶子键须带
  # diff_formula_ 前缀以与 cache.enabled 等区分，避免被 cache_enabled 重映射吞掉。
  diff_formula:
    diff_formula_enabled: true
    diff_formula_candidates: 6       # 每轮生成的候选数
    diff_formula_k_sur: 25           # 发现段优化用 surrogate 数（z 分数目标不触地板，无需过高）
    diff_formula_n_steps: 12         # 局部坐标精炼步数
    diff_formula_wf_k_sur: 25        # 模块内确认闸门 surrogate 数（仅 confirm=True 时生效；run_cycle 默认 confirm=False 走统一闸门）

  # 红队自审（诚实守护，默认关闭）：只读对抗审计器，挑自己结论的毛病
  # （多重比较通胀/退化统计/确认段完整性/过度声称/阳性对照完整性），绝不搜索结构、
  # 绝不自动合并、不改代码。启用后每轮 cycle 末尾读 state.json 写 audit/report。
  # 注：叶子键带 redteam_ 前缀（loader 扁平化丢父级名，避免与其它段撞键）。
  redteam:
    redteam_audit_enabled: true
    redteam_out: audit                 # 报告输出子目录（DATA_DIR 下）

  # 调度模式（daemon_loop.py 读取；控制引擎何时跑全量 cycle）
  #   schedule_mode 取值（daemon_loop 仅对 == "data_driven" 特殊处理，其它值一律回退定时/连续）：
  #     "data_driven" — 无新数据时长假休眠，仅开奖日才跑 GA（已弃用：导致两次开奖间算力空转）。
  #     其它/未设置   — 回退定时模式(CYCLE_MINUTES / schedule_hours)，持续迭代。
  #   现状(2026-08-21)：改为定时迭代。schedule_hours=0.25 → 每 15min 跑一轮 GA，
  #   真正 7×24 用公式迭代，不再 idle 等开奖（修复"算力空转"）。
  #   如需最大算力：设 CYCLE_MINUTES=0（连续 60s 冷却）或把 schedule_hours 调更小。
  #   注意：schedule_mode 必须是顶层键（daemon 读 cfg.get("schedule_mode")），
  #   不要包在 schedule: 父键下，否则读不到会回退到 schedule_hours 兜底。
  schedule_mode: timed
  idle_minutes: 360
  check_minutes: 60
