# GitHub Actions —— ssq_evo 测试门禁（仅此用途）
#
# 重要架构决策（2026-08-15 重构）：
#   - 本地 Docker 引擎（daemon_loop + run_cycle）是**唯一**的结构搜索引擎与真相源；
#     运行数据/状态落在 D:\ssq_evo_data（DATA_DIR 卷），已移出公开仓库(.gitignore)，
#     不再由 CI 自动提交，避免：公开仓库塞增长型二进制 DB、与用户 push 撞车、双引擎状态分裂。
#   - 因此本 workflow **不再跑 cycle、不再提交数据**，只做代码门禁：push/PR 时跑测试套件，
#     防止坏代码合入 main。
name: SSQ Evo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --no-cache-dir numpy scipy pytest

      - name: Run test suite
        env:
          DATA_DIR: ${{ github.workspace }}
        run: python -m pytest tests/ -q

  docker-build:
    # 抓 Dockerfile 漏拷 .py / 容器内 import 崩溃（历史反复出现：提交后容器跑旧码/缺模块）。
    # ubuntu-latest runner 自带 docker；compose build 注入 GIT_SHA 供 verify 比对。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image with GIT_SHA
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          docker compose build --build-arg GIT_SHA="$GIT_SHA"

      - name: Smoke import all modules (catches missing COPY)
        run: |
          docker compose run --rm ssq-evo python -c \
            "import engine_core,data,store,run_cycle,daemon_loop,frontier,make_dashboard,nonstationarity,evaluator,cache,diff_formula,positive_control,redteam_audit,representation_zoo,layered_null,run_axes,firewall,proposer,scoring,formula_viz,predict_tonight,ssq_health; print('IMPORT_OK')"
