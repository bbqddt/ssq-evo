name: cloud-register

# 云端兜底预注册（2026-09-09 设计落地）：
#   PC 在开奖日 18:00 关机/掉线时的最后防线。开奖日 18:30（北京时间）在云端登记预测，
#   commit 时间戳 = GitHub 侧第三方背书的预注册证据，且完全摆脱 PC 开机依赖。
# 配合本地 sync_cloud()（predict_tonight.auto 开头）：本地 register/score 前先拉取
# data-backup 合并（union by issue，最早 registered_ts 胜，已打分条目不可变）。
# 幂等：auto:register 自带"已登记跳过 + 已开奖跳过 + 过 21:15 拒绝补登记"三重守卫。

on:
  schedule:
    # 2026-09-25 调整：北京 17:45（UTC 09:45）= 本地 18:00 cron 之前 15 分钟。
    # 原 18:30 北京 + GitHub 调度延迟（实测 9/24 延迟 ~1h，23:18 才跑到）撞上
    # 21:15 诚实红线 → 兜底形同虚设。提前到开奖前 3.5h，延迟容忍度大幅放宽；
    # 若云端先登记成功，本地 18:00 的 sync 合并按"最早 registered_ts 胜"自然共存。
    - cron: "45 9 * * 2,4,0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cloud-register
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install numpy tzdata

      - name: Stage data dir from data-backup branch
        run: |
          set -e
          git fetch origin data-backup
          # 记住 data-backup 的 SHA 供 push 相用——FETCH_HEAD 不可靠：python 侧
          # sync_cloud() 的 fetch 若中途失败会把 FETCH_HEAD 清掉（9/24 连败链一环）。
          echo "BACKUP_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          mkdir -p cloud_data
          git show FETCH_HEAD:ssq_master.csv    > cloud_data/ssq_master.csv
          git show FETCH_HEAD:predictions.jsonl > cloud_data/predictions.jsonl
          if git show FETCH_HEAD:frontier.json > cloud_data/frontier.json 2>/dev/null; then
            echo "frontier.json staged (comp-ensemble method parity with local)"
          else
            echo "frontier.json absent on data-backup; register falls back to marginal (recorded honestly in method field)"
          fi

      - name: 输出诚实声明
        run: |
          echo "::notice::诚实声明：当前引擎结论 walk-forward = NULL，预测为 null 域外样本检验，不构成预知或投注建议"
      - name: Register prediction (draw-day + pre-21:15 Beijing guarded, idempotent)
        env:
          DATA_DIR: ${{ github.workspace }}/cloud_data
        run: python predict_tonight.py auto --phase register

      - name: Push updated predictions.jsonl to data-backup
        run: |
          set -e
          # 用 stage 相记录的 BACKUP_SHA，不用 FETCH_HEAD——python sync_cloud 的
          # fetch 若失败会清掉 FETCH_HEAD（9/24 连败链：sync 炸→push 相 invalid object）
          git diff --no-index --quiet <(git show "$BACKUP_SHA":predictions.jsonl) cloud_data/predictions.jsonl && {
            echo "no change (already registered / not a draw day / post-draw guard rejected); nothing to push"
            exit 0
          }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B data-backup-work "$BACKUP_SHA"
          cp cloud_data/predictions.jsonl predictions.jsonl
          git add predictions.jsonl
          git commit -m "cloud-register: pre-draw registration ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin HEAD:data-backup
